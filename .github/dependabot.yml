# Upstream is quiet, so keep the fork's dependencies current ourselves. Targets the default
# branch (`homelab`); a merged PR builds a new image that Renovate rolls out.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Must move in lockstep with `kube` (which pins its own k8s-openapi); a lone bump
      # leaves two versions in the tree and the build fails. Bump both by hand.
      - dependency-name: k8s-openapi
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

name: Homelab image

# Builds the `homelab` branch into ghcr.io/<owner>/autokuma:homelab-<run number>
# and creates a matching GitHub release, which Renovate shows as release notes.
# Deliberately not tag-triggered: upstream's own workflows run on tags and would
# try to publish to ghcr.io/bigboot. The release tag below is created with
# GITHUB_TOKEN, which doesn't trigger other workflows.
on:
  push:
    branches:
      - homelab
    # Docs-only pushes don't need a new image/release/Renovate PR.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autokuma" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:homelab-${{ github.run_number }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: homelab-${{ github.run_number }}
        run: |
          prev=$(git tag -l 'homelab-*' --sort=-v:refname | head -n1)
          {
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD; then
              echo "## Changes since $prev"
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
              echo
            fi
            echo "## Patches on top of upstream (\`$(git log -1 --format='%h %s' origin/master)\`)"
            git log --no-merges --format='- %s (%h)' origin/master..HEAD
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

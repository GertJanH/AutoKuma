name: Homelab image

# Builds the `homelab` branch into ghcr.io/<owner>/autokuma:<upstream version>-homelab.<run number>
# (e.g. 2.1.0-rc.2-homelab.6) and creates a matching GitHub release, which Renovate shows as
# release notes. Pull requests (e.g. Dependabot) only get a build check, nothing is published.
# Deliberately not tag-triggered: upstream's own workflows run on tags and would try to publish
# to ghcr.io/bigboot. The release tag below is created with GITHUB_TOKEN, which doesn't trigger
# other workflows.
on:
  push:
    branches:
      - homelab
    # Docs-only pushes don't need a new image/release/Renovate PR.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - homelab
  workflow_dispatch:

# Several pushes in a row (e.g. merging a batch of Dependabot PRs) only build the newest one.
concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          base=$(git describe --tags --match 'v[0-9]*' --abbrev=0 | sed 's/^v//')
          echo "tag=${base}-homelab.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autokuma" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev=$(git tag -l '*homelab*' --sort=-creatordate | head -n1)
          {
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD; then
              echo "## Changes since $prev"
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
              echo
            fi
            echo "## Patches on top of upstream (\`$(git log -1 --format='%h %s' origin/master)\`)"
            git log --no-merges --format='- %s (%h)' origin/master..HEAD
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
